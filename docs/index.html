<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Agents Replay</title>
<meta name="description" content="Two AI chess agents play each other; one keeps a notebook of lessons to improve. Replay their games with their thoughts, a Stockfish evaluation bar, and your own analysis.">
<meta property="og:title" content="Self-Improving AI Chess Agents">
<meta property="og:description" content="Replay games between AI chess agents, read what they were thinking, and analyse positions with Stockfish.">
<link rel="icon" href="pieces/wN.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <header class="page-head">
    <h1>Self-Improving AI Chess Agents</h1>
    <span class="subtitle">Game replay</span>
    <a class="head-link" id="live-link" href="live.html">Watch in 3D ↗</a>
  </header>

  <div class="stage">
    <div class="board-column">
      <div class="player-bar" id="bar-top"></div>
      <div class="board-wrap">
        <div class="eval-bar" id="eval-bar" title="Evaluation by Stockfish">
          <div class="eval-fill"></div>
          <span class="eval-label"></span>
        </div>
        <div class="board-frame" id="board-frame">
          <div class="board"></div>
        </div>
      </div>
      <div class="player-bar" id="bar-bottom"></div>
    </div>

    <aside class="side-panel">
      <label class="field">
        <span>Game</span>
        <select id="game-select"></select>
      </label>
      <p class="players" id="players"></p>

      <div class="controls">
        <button id="start" title="Go to the start">⏮</button>
        <button id="back" title="Previous move (← key)">◀</button>
        <button id="play" class="play" title="Play / pause (space bar)">▶ Play</button>
        <button id="next" title="Next move (→ key)">▶</button>
        <button id="end" title="Go to the end">⏭</button>
      </div>
      <div class="controls secondary">
        <label class="inline-field">Speed
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <label class="inline-field" title="Also show the thought as a speech bubble on the board"><input type="checkbox" id="show-bubbles"> Bubbles on board</label>
        <button id="flip" title="Turn the board around">⇅ Flip</button>
      </div>

      <div class="analysis-banner" id="analysis-banner" hidden>
        <div class="analysis-title">Analysis mode: your own moves</div>
        <div class="analysis-line" id="analysis-line"></div>
        <button id="back-to-game">↩ Back to game</button>
      </div>

      <div class="move-info" id="move-info">
        <div class="counter" id="counter"></div>
        <div class="move" id="move"></div>
        <div class="grade" id="grade"></div>
        <!-- The player's thinking, shown as a speech bubble from their king icon. -->
        <div class="thought-card" id="thought-card" hidden>
          <img class="thought-avatar" id="thought-avatar" alt="">
          <div class="thought-bubble">
            <div class="who" id="who"></div>
            <div class="thought" id="thought"></div>
            <div class="thinking-dots" id="thinking-dots" hidden><span></span><span></span><span></span></div>
          </div>
        </div>
        <div class="result" id="result"></div>
      </div>

      <!-- Game review: each player's accuracy, graded by Stockfish (arena/review.py). -->
      <div class="review-card" id="review-card" hidden>
        <div class="review-title">Game review</div>
        <div class="review-rows" id="review-rows"></div>
        <div class="review-note">Graded by Stockfish, using Lichess's accuracy formula.</div>
      </div>

      <div class="engine-line" id="engine-line">Stockfish is starting…</div>
      <div class="check" id="check"></div>

      <div class="move-list" id="move-list" aria-label="Moves"></div>

      <p class="hint">Tip: drag or click any piece to try your own moves.</p>
      <pre id="selftest" class="selftest" hidden></pre>
    </aside>
  </div>
</main>

<script src="js/board.js"></script>
<script src="js/replay.js"></script>
<script src="js/engine.js"></script>
<script src="js/analysis.js"></script>
<script src="js/overlays.js"></script>
<script src="js/material.js"></script>
<script type="module">
  import { Chess } from "./js/lib/chess.js";

  const $ = (id) => document.getElementById(id);
  const board = new ChessBoard($("board-frame"));
  const evalBar = new EvalBar($("eval-bar"));
  const bubble = new ThoughtBubble(board);
  const resultCard = new ResultCard(board);
  const arrows = new ArrowLayer(board);
  const bars = new PlayerBars($("bar-top"), $("bar-bottom"));
  const updateBars = () => bars.update(board, {
    white: replay.diary ? replay.diary.white.name : "White",
    black: replay.diary ? replay.diary.black.name : "Black",
  });
  board.flipListeners.push(updateBars);
  const replay = new Replay(board, {
    players: $("players"), counter: $("counter"), move: $("move"), who: $("who"),
    thought: $("thought"), result: $("result"), check: $("check"), grade: $("grade"),
  });
  const autoplay = new Autoplay(replay, (playing) => {
    $("play").textContent = playing ? "⏸ Pause" : "▶ Play";
    $("play").classList.toggle("playing", playing);
    if (!playing) showThoughtCard();   // stopped while "thinking": show the real move again
  });
  // During autoplay, the player about to move "thinks" for a moment first.
  autoplay.onThinking = (color) => {
    const name = color === "white" ? replay.diary.white.name : replay.diary.black.name;
    $("thought-card").hidden = false;
    $("thought-avatar").src = `pieces/${color[0]}K.svg`;
    $("who").textContent = `${name} is thinking`;
    $("thought").hidden = true;
    $("thinking-dots").hidden = false;
  };
  const moveList = new MoveList($("move-list"), (ply) => { stopEverything(); replay.goTo(ply); });

  let engine = null;
  const analysis = new Analysis(board, replay, Chess, positionChanged);
  replay.onChange = positionChanged;

  /* Called after every change of position: highlights, speech bubble,
     result card, move list, analysis panel and the Stockfish evaluation. */
  function positionChanged() {
    const inAnalysis = analysis.active;
    arrows.clear();   // like chess.com: arrows disappear when a move is made
    updateBars();
    $("analysis-banner").hidden = !inAnalysis;
    $("move-info").classList.toggle("dimmed", inAnalysis);
    $("check").hidden = inAnalysis;  // the diary check only applies to the real game

    if (inAnalysis) {
      autoplay.stop();
      $("analysis-line").textContent = analysis.lineText();
      const history = analysis.chess.history({ verbose: true });
      const last = history[history.length - 1];
      board.setHighlights(last ? { from: last.from, to: last.to } : null,
                          analysis.chess.inCheck() ? board.findKing(analysis.chess.turn()) : null);
      bubble.hide();
      resultCard.hide();
    } else if (replay.diary) {
      const m = replay.current > 0 ? replay.diary.moves[replay.current - 1] : null;
      const sideToMove = m && m.color === "white" ? "b" : "w";
      board.setHighlights(m ? { from: m.from, to: m.to } : null,
                          m && m.check ? board.findKing(sideToMove) : null);
      showBubble(m);
      showThoughtCard();
      moveList.setCurrent(replay.current);
      if (replay.current === replay.total && replay.diary.result !== "*") {
        resultCard.show(replay.diary.result_text, `${replay.diary.result} · ${Math.ceil(replay.total / 2)} moves`,
                        m ? board.squareCell(m.to).row : 4);
      } else {
        resultCard.reset();
      }
    }

    if (!engine) return;
    const fen = analysis.fen();
    engine.analyse(fen, ({ score, depth, bestMoveUci }) => {
      evalBar.show(score);
      let best = "";
      if (bestMoveUci) {
        try {
          const probe = new Chess(fen);
          best = " · Best move: " + probe.move({
            from: bestMoveUci.slice(0, 2), to: bestMoveUci.slice(2, 4),
            promotion: bestMoveUci[4] || "q" }).san;
        } catch { /* no move to show */ }
      }
      $("engine-line").textContent = `Stockfish: ${scoreText(score)} (depth ${depth})${best}`;
    });
  }

  /* The thinking card in the side panel: king icon + what the player thought. */
  function showThoughtCard() {
    const m = replay.diary && replay.current > 0 ? replay.diary.moves[replay.current - 1] : null;
    $("thought-card").hidden = !m;
    $("thinking-dots").hidden = true;
    $("thought").hidden = false;
    if (!m) return;
    $("thought-avatar").src = `pieces/${m.color[0]}K.svg`;
    $("who").textContent = m.color === "white" ? replay.diary.white.name : replay.diary.black.name;
    $("thought").textContent = m.thought;
  }

  /* The speech bubble shows real thoughts; plain move descriptions
     ("Pawn to e4.") only appear in the side panel. */
  function showBubble(m) {
    if (!m || !$("show-bubbles").checked || m.thought_source === "move_description") {
      bubble.hide();
      return;
    }
    const player = m.color === "white" ? replay.diary.white.name : replay.diary.black.name;
    const dots = m.color === "white" ? "." : "...";
    bubble.show(m.to, `${player} · ${m.move_number}${dots} ${m.san}`, m.thought, m.color);
  }

  /* The game review card: accuracy and counts of ?! ? ?? for each player. */
  function showReview(d) {
    $("review-card").hidden = !d.review;
    if (!d.review) return;
    const rows = ["white", "black"].map((color) => {
      const r = d.review[color];
      const row = document.createElement("div");
      row.className = "review-row";
      row.innerHTML = `<img alt="" src="pieces/${color[0]}K.svg"><span class="review-name"></span>` +
        `<span class="review-acc">${r.accuracy.toFixed(1)}%</span>` +
        `<span class="review-counts"><b class="inaccuracy">?! ${r.inaccuracies}</b>` +
        `<b class="mistake">? ${r.mistakes}</b><b class="blunder">?? ${r.blunders}</b></span>`;
      row.querySelector(".review-name").textContent = d[color].name;
      return row;
    });
    $("review-rows").replaceChildren(...rows);
  }

  // Using any control stops autoplay; moving through the game leaves analysis.
  function stopEverything() { autoplay.stop(); analysis.exit(); }

  $("play").onclick = () => { analysis.exit(); autoplay.toggle(); };
  $("next").onclick = () => { stopEverything(); replay.next(); };
  $("back").onclick = () => { autoplay.stop(); analysis.active ? analysis.back() : replay.back(); };
  $("start").onclick = () => { stopEverything(); replay.goTo(0); };
  $("end").onclick = () => { stopEverything(); replay.goTo(replay.total); };
  $("back-to-game").onclick = () => analysis.exit();
  $("speed").onchange = () => { autoplay.speed = Number($("speed").value); };
  $("show-bubbles").onchange = () => positionChanged();
  $("flip").onclick = () => {
    analysis.clearSelection();
    board.flip();
    evalBar.setFlipped(board.flipped);
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("back").click();
    if (e.key === " ") { e.preventDefault(); $("play").click(); }
  });

  async function loadGame(file) {
    stopEverything();
    await replay.load(file);
    moveList.build(replay.diary);
    showReview(replay.diary);
    const d = replay.diary;
    $("live-link").textContent = `Watch ${d.white.name} vs ${d.black.name} in 3D ↗`;
    $("live-link").href = `live.html?game=${encodeURIComponent(d.id)}`;
    positionChanged();
  }

  async function start() {
    board.setPosition("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
    if (location.protocol === "file:") {
      $("players").textContent =
        "To load games, open this page by double-clicking serve.bat in the project folder.";
      return;
    }
    const { games } = await (await fetch("games/index.json")).json();

    if (new URLSearchParams(location.search).has("check")) {
      const out = $("selftest");
      out.hidden = false;
      out.textContent = await runSelfTest(board, games);
      return;
    }

    try {
      engine = new Engine();
    } catch (err) {
      $("engine-line").textContent = "Stockfish could not start in this browser.";
    }

    // A link can open a chosen game at a chosen move: ?game=<id>&move=<half-move>
    const params = new URLSearchParams(location.search);
    const chosen = games.find((g) => g.id === params.get("game")) || games[0];

    const select = $("game-select");
    for (const g of games) select.add(new Option(`${g.title}`, g.file));
    select.value = chosen.file;
    select.onchange = () => loadGame(select.value);
    await loadGame(chosen.file);
    if (params.has("move")) replay.goTo(Number(params.get("move")));
  }
  start().catch((err) => { $("players").textContent = "Something went wrong: " + err.message; });

  // Lets automatic tests reach the page's parts.
  window.app = { board, replay, analysis, evalBar, autoplay, bubble, resultCard, arrows, bars,
                 get engine() { return engine; } };
</script>
</body>
</html>

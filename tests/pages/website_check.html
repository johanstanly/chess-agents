<!doctype html>
<html>
<head><meta charset="utf-8"><title>Website check</title></head>
<body>
<img src="/__hold" hidden alt="">
<iframe id="f" style="width:1200px;height:800px"></iframe>
<script>
/* Drives the real replay page inside a frame and reports PASS/FAIL lines. */
const results = [];
const check = (ok, text) => results.push(`${ok ? "PASS" : "FAIL"}  ${text}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById("f");

function load(url) {
  return new Promise((resolve) => { frame.onload = resolve; frame.src = url; });
}
async function until(fn, ms = 20000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { const v = fn(); if (v) return v; await sleep(100); }
  return null;
}
const doc = () => frame.contentDocument;
const app = () => frame.contentWindow.app;

/* Waits for Stockfish to reach `depth`, returns the engine line text. */
async function evaluation(depth = 12) {
  await sleep(300);
  return until(() => {
    const t = doc().getElementById("engine-line").textContent;
    const m = t.match(/depth (\d+)/);
    return m && (Number(m[1]) >= depth || /1-0|0-1/.test(t)) ? t : null;
  }, 30000);
}
const pawnsIn = (text) => {
  const m = text.match(/Stockfish: ([+-]?\d+\.\d)/);
  return m ? Number(m[1]) : null;
};

async function run() {
  // 1. Self-test of all diaries (the Phase 3 check).
  await load("/index.html?check");
  const selftest = await until(() => {
    const t = doc().getElementById("selftest").textContent;
    return /PASSED|FAILED/.test(t) ? t : null;
  });
  check(selftest && selftest.includes("ALL GAMES PASSED"), "replay self-test: every move of every diary matches");

  // 2. Evaluation bar at the start and end of the Kasparov game.
  await load("/index.html?game=sample-kasparov-topalov-1999");
  await until(() => app() && app().replay.diary);
  let line = await evaluation();
  const startPawns = line && pawnsIn(line);
  check(startPawns !== null && Math.abs(startPawns) < 1.0, `start position is roughly equal (${line})`);

  app().replay.goTo(app().replay.total);
  line = await evaluation();
  const endPawns = line && pawnsIn(line);
  const whiteWinning = line && (/M\d/.test(line) && !line.includes("-M") ? true : endPawns > 3);
  check(whiteWinning, `final position: White clearly winning (${line})`);
  const fillHeight = parseFloat(doc().querySelector(".eval-fill").style.height);
  check(fillHeight > 70, `eval bar is mostly white at the end (${fillHeight}%)`);

  // 3. Checkmate position in Lasker vs Thomas.
  await load("/index.html?game=sample-lasker-thomas-1912&move=35");
  await until(() => app() && app().replay.current === 35);
  line = await evaluation(0);
  check(line && line.includes("1-0"), `checkmate position shows 1-0 (${line})`);

  // 4. Analysis mode from move 47 of the Kasparov game.
  await load("/index.html?game=sample-kasparov-topalov-1999&move=47");
  await until(() => app() && app().replay.current === 47);
  const a = app().analysis;
  // Black to move; a white move must be refused.
  check(a.tryMove("d4", "d8") === false, "illegal move (wrong side) is refused");
  check(!a.active, "a refused move does not start analysis mode");
  check(a.tryMove("c5", "d4") === true, "legal move 24... cxd4 accepted");
  check(a.active && doc().querySelector(".board").classList.contains("analysis"),
        "analysis mode is on and the board is tinted");
  check(!doc().getElementById("analysis-banner").hidden, "analysis banner is shown");
  check(app().board.matchesFen(a.fen()), "board matches the analysis position");
  a.tryMove("e1", "e7");
  check(doc().getElementById("analysis-line").textContent === "24... cxd4 25. Re7+",
        `your moves are listed (${doc().getElementById("analysis-line").textContent})`);
  doc().getElementById("back-to-game").click();
  check(!a.active && app().replay.current === 47, "Back to game returns to half-move 47");
  check(app().board.matchesFen(app().replay.expectedFen()), "board matches the real game again");

  // 5. Castling and en passant in analysis, from the start position.
  app().replay.goTo(0);
  for (const [f, t] of [["e2","e4"],["e7","e5"],["g1","f3"],["b8","c6"],["f1","c4"],["g8","f6"],["e1","g1"]]) a.tryMove(f, t);
  check(app().board.pieces["f1"] && app().board.pieces["f1"].dataset.code === "wR" && app().board.matchesFen(a.fen()),
        "castling in analysis moves the rook too");
  a.exit();
  for (const [f, t] of [["e2","e4"],["a7","a6"],["e4","e5"],["d7","d5"],["e5","d6"]]) a.tryMove(f, t);
  check(!app().board.pieces["d5"] && app().board.matchesFen(a.fen()), "en passant in analysis removes the right pawn");
  // Back button steps out of analysis one move at a time.
  for (let i = 0; i < 5; i++) doc().getElementById("back").click();
  check(!a.active && app().replay.current === 0, "Back takes moves back, then returns to the game");

  // 6. Phase 4: autoplay, move list, highlights, speech bubble, result card.
  await load("/index.html?game=sample-kasparov-topalov-1999");
  await until(() => app() && app().replay.diary && doc().querySelectorAll(".ml-move").length);
  const d = doc();
  d.getElementById("speed").value = "4";
  d.getElementById("speed").dispatchEvent(new Event("change"));
  d.getElementById("play").click();
  const sawThinking = await until(() => getComputedStyle(d.getElementById("thinking-dots")).display !== "none"
                                   && d.getElementById("who").textContent.includes("is thinking"), 3000);
  check(!!sawThinking, "autoplay shows 'is thinking' dots before a move");
  await sleep(2500);
  const afterPlay = app().replay.current;
  check(afterPlay >= 3 && app().autoplay.playing, `autoplay moves by itself (reached half-move ${afterPlay})`);
  d.getElementById("play").click();
  const paused = app().replay.current;
  await sleep(1500);
  check(!app().autoplay.playing && app().replay.current === paused, "pause stops autoplay");

  const cells = d.querySelectorAll(".ml-move:not(:disabled)");
  check(cells.length === app().replay.total, `move list has all ${app().replay.total} moves`);
  cells[20].click();  // half-move 21: 11. O-O-O
  check(app().replay.current === 21 && cells[20].classList.contains("current"),
        "clicking 11. O-O-O in the move list jumps there and marks it");
  const hl = [...d.querySelectorAll(".hl-last")].map((e) => e.style.left + "," + e.style.top);
  const pos = (sq) => { const p = app().board.squarePosition(sq); return p.left + "," + p.top; };
  check(hl.length === 2 && hl.includes(pos("e1")) && hl.includes(pos("c1")),
        "last move highlighted on e1 and c1");
  const bub = d.querySelector(".bubble");
  check(!d.getElementById("thought-card").hidden && d.getElementById("thought").textContent.includes("castle queenside")
        && getComputedStyle(d.getElementById("thinking-dots")).display === "none"
        && d.getElementById("thought-avatar").getAttribute("src") === "pieces/wK.svg",
        "thinking card shows White's thought for 11. O-O-O");
  check(!bub.classList.contains("visible"), "no bubble on the board by default");
  d.getElementById("show-bubbles").click();
  check(bub.classList.contains("visible") && bub.textContent.includes("castle queenside"),
        "ticking 'Bubbles on board' shows the bubble");
  app().replay.goTo(3);  // 2. d4: plain move description, no bubble
  check(!bub.classList.contains("visible"), "no bubble for a plain move description");
  d.getElementById("show-bubbles").click();
  app().replay.goTo(21);
  check(!bub.classList.contains("visible"), "bubbles can be switched off again");

  app().replay.goTo(app().replay.total);
  const card = d.querySelector(".result-card");
  check(card.classList.contains("visible") && card.textContent.includes("White wins"),
        "result card shown at the end");
  app().replay.goTo(10);
  check(!card.classList.contains("visible"), "result card hidden before the end");

  await load("/index.html?game=sample-lasker-thomas-1912&move=21");  // 11. Qxh7+
  await until(() => app() && app().replay.current === 21);
  const chk = doc().querySelector(".hl-check");
  check(chk && chk.style.left + "," + chk.style.top === (() => { const p = app().board.squarePosition("g8"); return p.left + "," + p.top; })(),
        "king in check (g8) is highlighted red after 11. Qxh7+");

  await load("/index.html?game=test-special-moves&move=18");
  await until(() => app() && app().replay.current === 18);
  check(!doc().querySelector(".result-card").classList.contains("visible"),
        "no result card for an unfinished game");

  // 7. Captured pieces and points ahead (Lasker vs Thomas after 11... Kxh7).
  await load("/index.html?game=sample-lasker-thomas-1912&move=22");
  await until(() => app() && app().replay.current === 22);
  const pieceList = (el) => [...el.querySelectorAll(".captured img")].map((i) => i.getAttribute("src").slice(7, 9)).sort().join(" ");
  const topBar = doc().getElementById("bar-top"), bottomBar = doc().getElementById("bar-bottom");
  check(topBar.textContent.includes("George Alan Thomas") && topBar.querySelector(".lead")?.textContent === "+8",
        `Black's bar shows +8 (${topBar.querySelector(".lead")?.textContent})`);
  check(pieceList(topBar) === "wB wP wQ", `Black captured bishop, pawn, queen (${pieceList(topBar)})`);
  check(pieceList(bottomBar) === "bN bP bP" && !bottomBar.querySelector(".lead"),
        `White captured knight and two pawns, no lead (${pieceList(bottomBar)})`);
  doc().getElementById("flip").click();
  check(doc().getElementById("bar-top").textContent.includes("Edward Lasker"), "flipping moves White's bar to the top");
  doc().getElementById("flip").click();
  await load("/index.html?game=test-special-moves&move=18");  // both sides promoted
  await until(() => app() && app().replay.current === 18);
  const whiteBar = doc().getElementById("bar-bottom"), blackBar = doc().getElementById("bar-top");
  check(pieceList(whiteBar) === "bP bP bQ" && whiteBar.querySelector(".lead")?.textContent === "+1",
        `after promotions: White captured ${pieceList(whiteBar)}, lead ${whiteBar.querySelector(".lead")?.textContent}`);
  check(pieceList(blackBar) === "wP wP wP wR",
        `after promotions: Black captured ${pieceList(blackBar)} (promoted knight not counted as extra)`);

  // 8. Arrows and circles with the right mouse button.
  await load("/index.html?game=sample-kasparov-topalov-1999");
  await until(() => app() && app().replay.diary);
  const b = doc().querySelector(".board");
  const rect = b.getBoundingClientRect();
  const at = (sq) => ({ clientX: rect.left + ("abcdefgh".indexOf(sq[0]) + 0.5) * rect.width / 8,
                        clientY: rect.top + (8 - Number(sq[1]) + 0.5) * rect.height / 8 });
  const PE = frame.contentWindow.PointerEvent;
  const right = (type, sq) => b.dispatchEvent(new PE(type, { ...at(sq), button: 2, bubbles: true, pointerId: 2 }));
  right("pointerdown", "e2"); right("pointerup", "e4");
  check(app().arrows.marks.length === 1 && b.querySelectorAll(".arrows polyline").length === 1,
        "right-drag e2 to e4 draws an arrow");
  check(!app().analysis.selected, "right-click does not pick up the piece");
  right("pointerdown", "g1"); right("pointerup", "f3");
  const knightLine = b.querySelectorAll(".arrows polyline")[1];
  check(knightLine && knightLine.getAttribute("points").split(" ").length === 3, "knight arrow g1 to f3 is L-shaped");
  right("pointerdown", "d5"); right("pointerup", "d5");
  check(b.querySelectorAll(".arrows circle").length === 1, "right-click on one square draws a circle");
  right("pointerdown", "e2"); right("pointerup", "e4");
  check(app().arrows.marks.length === 2, "drawing the same arrow again removes it");
  b.dispatchEvent(new PE("pointerdown", { ...at("d5"), button: 0, bubbles: true, pointerId: 1 }));
  b.dispatchEvent(new PE("pointerup", { ...at("d5"), button: 0, bubbles: true, pointerId: 1 }));
  check(app().arrows.marks.length === 0 && !b.querySelector(".arrows polyline, .arrows circle"),
        "a left click clears all arrows and circles");
  right("pointerdown", "e2"); right("pointerup", "e4");
  doc().getElementById("next").click();
  check(app().arrows.marks.length === 0, "making a move clears the arrows");

  const failed = results.filter((r) => r.startsWith("FAIL")).length;
  results.push(failed ? `${failed} CHECK(S) FAILED` : "ALL CHECKS PASSED");
}

run()
  .catch((err) => results.push("FAIL  test crashed: " + err.message))
  .finally(() => fetch("/__done", { method: "POST", body: results.join("\n") }));
</script>
</body>
</html>
